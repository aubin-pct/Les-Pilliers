name: Tester et déployer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  docker:
    # Vérifie que l'image Docker du serveur de synchronisation se construit et démarre.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t les-piliers .
      - name: Démarrage et réponse de l'API
        run: |
          docker run -d --name piliers -p 8787:8787 -e SYNC_TOKEN=ci-0123456789abcdef0123456789 les-piliers
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/api/health && break; sleep 1; done
          curl -fsS http://localhost:8787/ | grep -q "Les Piliers"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/state)" = "401"
          curl -fsS -H "Authorization: Bearer ci-0123456789abcdef0123456789" http://localhost:8787/api/state
          docker logs piliers

  deploy:
    needs: [build, docker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
